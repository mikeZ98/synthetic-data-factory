name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bytecode and all tool state stay under ./.cache/ (audited by audit-hygiene.sh).
  PYTHONPYCACHEPREFIX: ./.cache/pycache
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  hygiene-and-attribution:
    name: hygiene and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history, and the PR *head* commit: on pull_request the default
      # checkout is GitHub's synthetic merge commit, which has a GitHub committer
      # and would (correctly) fail the sole-committer audit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Sole-committer audit
        run: scripts/audit-attribution.sh --history-only
      - name: Repository hygiene audit
        run: scripts/audit-hygiene.sh

  lint-and-typecheck:
    name: lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: ruff check
        run: uv run --locked ruff check
      - name: ruff format
        run: uv run --locked ruff format --check
      - name: mypy --strict
        run: uv run --locked mypy src tests tools --strict

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: bandit
        run: uv run --locked bandit -c pyproject.toml -r src

  test-and-coverage:
    name: tests and coverage (network-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      # pytest-socket (--disable-socket in pyproject addopts) blocks every
      # AF_INET/AF_INET6 socket; tests/test_network_isolation.py proves it.
      - name: 100.00% line and branch coverage
        run: ./scripts/coverage-gate.sh
      - name: Deterministic Hypothesis profile
        run: uv run --locked pytest -q --hypothesis-profile=ci
      - name: No stray tool state
        run: scripts/audit-hygiene.sh

  mutation-gate:
    name: mutation gate
    needs: test-and-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: AST mutation score (per-target minimums in tools/mutation.toml)
        run: ./scripts/run-mutation-tests.sh --workers "$(nproc)"
      - name: Mutation report
        if: always()
        run: |
          if [ -f .cache/mutation/report.md ]; then
            cat .cache/mutation/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    name: docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          tags: synthetic-data-factory:v0.1.0
          load: true
          push: false
          provenance: false
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, no dev tooling, read-only run, graceful SIGTERM)
        run: deploy/smoke-test.sh synthetic-data-factory:v0.1.0
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml --profile batch config --quiet
