[project]
name = "synthetic-data-factory"
version = "0.1.0"
description = "Curation pipeline for synthetic instruction datasets: validation, MinHash deduplication, Parquet export."
readme = "README.md"
authors = [
    { name = "mikeZ98", email = "145975972+mikeZ98@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "datasketch>=1.6.0",
    "numpy>=1.26",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "textual>=0.70.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.9",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "pyarrow-stubs>=17",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# Storage isolation: every tool writes its state under ./.cache/ (gitignored). #
# --------------------------------------------------------------------------- #

[tool.uv]
cache-dir = "./.cache/uv"

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the test vocabulary.
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["synthetic_data_factory"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["datasketch", "datasketch.*", "pytest_socket"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
minversion = "8.2"
testpaths = ["tests"]
# --disable-socket: any AF_INET/AF_INET6 socket raises SocketBlockedError.
# --allow-unix-socket: asyncio's self-pipe on macOS is an AF_UNIX socketpair (local IPC, not network).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--disable-socket",
    "--allow-unix-socket",
    # tmp_path / tmp_path_factory live under ./.cache/ (wiped at session start).
    "--basetemp=.cache/pytest-tmp",
]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
branch = true
source = ["synthetic_data_factory"]
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.json]
output = ".cache/coverage/coverage.json"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.bandit]
exclude_dirs = [".cache", ".venv", "tests"]
